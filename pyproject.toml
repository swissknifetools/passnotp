[tool.poetry]
name = "passnotp"
version = "0.1.0"
description = "Monorepo for passclip and otpclip"
authors = ["Joni Seraj <serajjoni@gmail.com>", "Ergi Kame<ergikame@gmail.com>"]
license = "MIT"
readme = "README.md"

packages = [
  { include = "./libs/console_logger" },
  { include = "./libs/config" },
]

[tool.poetry.scripts]
format = "scripts.format:main"
lint = "scripts.lint:main"


[tool.poetry.dependencies]
python = "^3.12"
pip = "^23.3.1"
pydantic = "^2.4.2"
pydantic-settings = "^2.0.3"
toml = "^0.10.2"


[tool.poetry.group.dev.dependencies]
black = "^23.10.0"
isort = "^5.12.0"
pytest = "^7.4.2"
pytest-cov = "^4.1.0"
pylint = "^3.0.1"
pre-commit = "^3.7.1"
flake8 = "^7.0.0"
mkdocs = "^1.6.0"
mkdocs-material = "^9.5.25"
mkdocstrings = "^0.25.1"

[build-system]
requires = ["setuptools", "poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.pylint."messages control"]
ignore = ["setup.py", "__init__.py"]
disable = "all"
enable = [
  "empty-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "missing-module-docstring"
]

[tool.isort]
profile = "black"
