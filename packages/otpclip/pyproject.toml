[tool.poetry]
name = "otpclip"
version = "0.1.0"
description = ""
authors = ["Joni Seraj <serajjoni@gmail.com>", "Ergi Kame<ergikame@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [
 {include="otpclip"},
 {include="shared", from="../../libs"}
]

[tool.poetry.scripts]
otpclip = 'otpclip.main:main'

[tool.poetry.dependencies]
python = "^3.12"
pip = "^23.3.1"
click = "^8.1.7"
pydantic = "^2.4.2"
pydantic-settings = "^2.0.3"

[tool.poetry.group.dev.dependencies]
flake8 = "^6.1.0"
black = "^23.10.0"
isort = "^5.12.0"
pytest = "^7.4.2"
pytest-cov = "^4.1.0"
pylint = "^3.0.1"


[build-system]
requires = ["setuptools", "poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.pylint."messages control"]
ignore = ["setup.py", "__init__.py"]
disable = "all"
enable = [
  "empty-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "missing-module-docstring"
]

[tool.isort]
profile = "black"
