site_name: passnotp 
site_url: https://swissknifetools.github.io/passnotp/
site_description: Monorepo for passclip and otpclip
site_author: Joni Seraj, Ergi Kame
site_favicon: ./assets/logo.svg

theme:
  name: material
  logo: assets/logo.svg
  favicon: ./assets/logo.svg
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      primary: custom
      scheme: default 
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      primary: custom
      accent: custom
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.expand
    - navigation.sections
    - navigation.footer
    - toc.integrate
    - search.highlight
    - search.share
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.action.view
    - content.code.annotate


nav:
  - Home: index.md
  - Console Logger: libs/console_logger.md
  

extra_css:
- stylesheets/theme.css

plugins:
    - search
    - mkdocstrings:
        default_handler: python
        handlers:
        python:
            rendering:
            show_source: true 
            show_root_heading: true
            show_category_heading: true
            show_object_full_path: false
            show_if_no_docstring: true
        watch:
        - ./